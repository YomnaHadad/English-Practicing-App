# Render Blueprint: one Docker web service + one Postgres database.
# Plan names and free-tier limits change - check Render's current pricing page and adjust `plan:`.
databases:
  - name: movie-shadowing-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: movie-shadowing
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeployTrigger: checksPass   # deploy only after the GitHub Actions CI passes
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: movie-shadowing-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: GROQ_API_KEY
        sync: false          # Render asks for these when you create the Blueprint
      - key: OPENSUBTITLES_API_KEY
        sync: false
